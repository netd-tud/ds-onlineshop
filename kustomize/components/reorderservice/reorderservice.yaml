apiVersion: apps/v1
kind: Deployment
metadata:
  name: reorderservice
  labels:
    app: reorderservice
spec:
  selector:
    matchLabels:
      app: reorderservice
  template:
    metadata:
      labels:
        app: reorderservice
    spec:
      serviceAccountName: reorderservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          image: ghcr.io/netd-tud/ds-onlineshop/reorderservice:latest
          env:
            - name: PORT
              value: "50001"
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 100m
              memory: 200Mi
---
apiVersion: v1
kind: Service
metadata:
  name: reorderservice
  labels:
    app: reorderservice
spec:
  type: ClusterIP
  selector:
    app: reorderservice
  ports:
    - name: http
      port: 50001
      targetPort: 50001
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reorderservice
