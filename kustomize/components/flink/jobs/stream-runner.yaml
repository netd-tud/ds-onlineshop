apiVersion: batch/v1
kind: Job
metadata:
  name: flink-sql-runner
  namespace: flink
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      tolerations:
        - key: dedicated
          operator: Equal
          value: flink
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload
                    operator: In
                    values: ["flink", "fallback"]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload
                    operator: In
                    values: ["flink"]
      initContainers:
        - name: wait-and-setup
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              echo "Downloading required jdbc connectors..."

              # 1. Flink JDBC Connector
              curl -sL https://repo1.maven.org/maven2/org/apache/flink/flink-connector-jdbc/3.2.0-1.19/flink-connector-jdbc-3.2.0-1.19.jar \
                -o /flink-lib/flink-connector-jdbc-3.2.0-1.19.jar

              # 2. PostgreSQL JDBC Driver
              curl -sL https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.3/postgresql-42.7.3.jar \
                -o /flink-lib/postgresql-42.7.3.jar

              echo "Fetching Kafka SQL Connector..."
              curl -sL https://repo1.maven.org/maven2/org/apache/flink/flink-sql-connector-kafka/3.2.0-1.19/flink-sql-connector-kafka-3.2.0-1.19.jar \
                -o /flink-lib/flink-sql-connector-kafka-3.2.0-1.19.jar

              echo "Waiting for Flink JobManager REST API..."
              until curl -s http://flink-jobmanager:8081/v1/overview > /dev/null; do
                sleep 2
              done
              echo "JobManager is ready!"
          volumeMounts:
            - name: flink-lib
              mountPath: /flink-lib
      containers:
        - name: sql-client
          image: flink:1.19.0
          command: ["/docker-entrypoint.sh"]
          args:
            - /bin/bash
            - -c
            - |
              set -e

              echo "Canceling old running jobs..."
              /opt/flink/bin/flink list -m flink-jobmanager:8081 | grep -oE '[a-f0-9]{32}' | xargs -r -I {} /opt/flink/bin/flink cancel -m flink-jobmanager:8081 {} || true

              echo "Waiting for slots to free..."
              sleep 3

              # ==========================================
              # 1. BUILD JOB 1: Raw Orders Stream
              # ==========================================
              echo "Building Job 1 (Raw Orders)..."
              cat /opt/flink/sql/setup/00_setup.sql > /tmp/job_01_raw.sql
              echo "" >> /tmp/job_01_raw.sql
              cat /opt/flink/sql/stream/01_raw_orders.sql >> /tmp/job_01_raw.sql

              # ==========================================
              # 2. BUILD JOB 2: Combined Metrics
              # ==========================================
              echo "Building Job 2 (Combined Metrics Statement Set)..."

              # A. Add Source DDLs
              cat /opt/flink/sql/setup/00_setup.sql > /tmp/job_02_metrics.sql
              echo "" >> /tmp/job_02_metrics.sql

              # B. Extract Sink CREATE TABLE DDLs from all files starting with 10 or higher
              echo "-- Sink DDLs" >> /tmp/job_02_metrics.sql
              for file in $(ls /opt/flink/sql/stream/[1-7][0-9]_*.sql | sort); do
                echo "-- DDL from $file" >> /tmp/job_02_metrics.sql
                awk '/CREATE TABLE/,/\);/' "$file" >> /tmp/job_02_metrics.sql
                echo "" >> /tmp/job_02_metrics.sql
              done

              # C. Wrap all INSERT INTO queries into a single STATEMENT SET
              echo "EXECUTE STATEMENT SET" >> /tmp/job_02_metrics.sql
              echo "BEGIN" >> /tmp/job_02_metrics.sql

              for file in $(ls /opt/flink/sql/stream/[1-7][0-9]_*.sql | sort); do
                echo "-- Query from $file" >> /tmp/job_02_metrics.sql
                awk '/INSERT INTO/,/;/' "$file" >> /tmp/job_02_metrics.sql
                echo "" >> /tmp/job_02_metrics.sql
              done

              echo "END;" >> /tmp/job_02_metrics.sql

              # ==========================================
              # 3. SUBMIT JOBS TO FLINK
              # ==========================================
              echo "--- Submitting Job 1: Raw Orders ---"
              /opt/flink/bin/sql-client.sh \
                -j /flink-lib/flink-sql-connector-kafka-3.2.0-1.19.jar \
                -j /flink-lib/flink-connector-jdbc-3.2.0-1.19.jar \
                -j /flink-lib/postgresql-42.7.3.jar \
                -f /tmp/job_01_raw.sql

              echo "--- Submitting Job 2: Combined Metrics ---"
              /opt/flink/bin/sql-client.sh \
                -j /flink-lib/flink-sql-connector-kafka-3.2.0-1.19.jar \
                -j /flink-lib/flink-connector-jdbc-3.2.0-1.19.jar \
                -j /flink-lib/postgresql-42.7.3.jar \
                -f /tmp/job_02_metrics.sql

              echo "All jobs successfully submitted!"
          envFrom:
            - configMapRef:
                name: flink-config
          volumeMounts:
            - name: flink-setup-sql
              mountPath: /opt/flink/sql/setup
            - name: flink-stream-sql
              mountPath: /opt/flink/sql/stream
            - name: flink-lib
              mountPath: /flink-lib
      volumes:
        - name: flink-lib
          emptyDir: {}
        - name: flink-setup-sql
          configMap:
            name: flink-setup-sql
        - name: flink-stream-sql
          configMap:
            name: flink-stream-sql
