apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - namespace.yaml
  - configmap.yaml
  - jobmanager.yaml
  - taskmanager.yaml
  - sql-runner-job.yaml
  - postgres.yaml

configMapGenerator:
  - name: flink-sql-scripts
    namespace: flink
    files:
      - sql/00_setup.sql
      - sql/01_raw_orders.sql
      - sql/10_product_sales_1m.sql
      - sql/11_product_clicks_1m.sql
      - sql/20_view_to_cart_1h.sql
      - sql/21_average_order_value_1h.sql
