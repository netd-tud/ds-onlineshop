apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: flink
type: Opaque
stringData:
  POSTGRES_DB: "analytics_db"
  POSTGRES_USER: "user"
  POSTGRES_PASSWORD: "password"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: flink
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS products (
      sku VARCHAR(255) PRIMARY KEY,
      name VARCHAR(255) NOT NULL,
      description TEXT,
      picture VARCHAR(255),
      price_usd_currency_code VARCHAR(3),
      price_usd_units BIGINT,
      price_usd_nanos INTEGER,
      categories TEXT[]
    );

    CREATE TABLE IF NOT EXISTS raw_order_events (
      event_id VARCHAR(255) PRIMARY KEY,
      event_time TIMESTAMPTZ NOT NULL,
      event_type VARCHAR(64) NOT NULL,
      order_id VARCHAR(255),
      session_id VARCHAR(255),
      producer VARCHAR(255),
      currency_code VARCHAR(10),
      price_units BIGINT,
      price_nanos INT,
      amount DOUBLE PRECISION,
      created_at TIMESTAMPTZ DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_raw_order_events_time
    ON raw_order_events (event_time);
    CREATE INDEX IF NOT EXISTS idx_raw_order_events_order_id
    ON raw_order_events (order_id);

    CREATE TABLE IF NOT EXISTS product_sales_1m (
      sku VARCHAR(255) NOT NULL,
      total_units_bought INT NOT NULL,
      window_start TIMESTAMP NOT NULL,
      PRIMARY KEY (sku, window_start)
    );

    CREATE TABLE IF NOT EXISTS product_clicks_1m (
      sku VARCHAR(255) NOT NULL,
      total_clicks BIGINT NOT NULL,
      window_start TIMESTAMP NOT NULL,
      PRIMARY KEY (sku, window_start)
    );

    CREATE TABLE IF NOT EXISTS product_view_to_cart_1h (
      sku VARCHAR(255) NOT NULL,
      window_start TIMESTAMP NOT NULL,
      window_end TIMESTAMP NOT NULL,
      total_views BIGINT NOT NULL DEFAULT 0,
      total_atc BIGINT NOT NULL DEFAULT 0,
      view_to_cart_rate DOUBLE PRECISION,
      PRIMARY KEY (sku, window_start)
    );

    CREATE TABLE IF NOT EXISTS order_aov_1h (
      currency_code VARCHAR(10) NOT NULL,
      window_start TIMESTAMP NOT NULL,
      window_end TIMESTAMP NOT NULL,
      total_orders BIGINT NOT NULL DEFAULT 0,
      total_revenue DOUBLE PRECISION NOT NULL DEFAULT 0.0,
      average_order_value DOUBLE PRECISION NOT NULL DEFAULT 0.0,
      PRIMARY KEY (currency_code, window_start)
    );

    CREATE TABLE IF NOT EXISTS product_recommendations (
      sku_a VARCHAR(255) NOT NULL,
      sku_b VARCHAR(255) NOT NULL,
      co_purchase_count BIGINT NOT NULL,
      PRIMARY KEY (sku_a, sku_b)
    );
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: flink
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: flink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
          args:
            - "-c"
            - "config_file=/etc/postgresql/postgresql.conf"
          envFrom:
            - secretRef:
                name: postgres-secret
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - su-exec postgres pg_ctl stop -D "$PGDATA" -m fast -t 25
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
            - name: config-volume
              mountPath: /etc/postgresql
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: [ "pg_isready", "-U", "user", "-d", "analytics_db" ]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-script
          configMap:
            name: postgres-init-sql
        - name: config-volume
          configMap:
            name: postgres-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: flink
data:
  postgresql.conf: |
    checkpoint_timeout = '5min'
    checkpoint_completion_target = 0.9
    min_wal_size = '128MB'
    max_wal_size = '512MB'
    listen_addresses = '*'
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: flink
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
