# ==========================================
# MQTT (TLS Terminated)
# ==========================================
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: warehouse-mqtt
  namespace: default
spec:
  entryPoints:
    - mqtt
  routes:
    - match: HostSNI(`*`)
      services:
        - name: mqtt-broker
          port: 1883

---
# ==========================================
# LDAP (TLS Terminated)
# ==========================================
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: ldap-server
  namespace: default
spec:
  entryPoints:
    - ldap
  routes:
    - match: HostSNI(`ds-exercise-01.netd.cs.tu-dresden.de`)
      services:
        - name: ldap
          port: 3890
  tls: {}

---
# ==========================================
# Auth Service - gRPC
