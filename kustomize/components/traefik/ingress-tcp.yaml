# ==========================================
# MQTT (TLS Terminated)
# ==========================================
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: warehouse-mqtt
  namespace: default
spec:
  entryPoints:
    - mqtt
  routes:
    - match: HostSNI(`ds-exercise-01.netd.cs.tu-dresden.de`)
      services:
        - name: mqtt-broker
          port: 1883
  tls: {}

---
