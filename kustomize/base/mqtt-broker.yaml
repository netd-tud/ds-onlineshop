apiVersion: v1
kind: ConfigMap
metadata:
  name: mqtt-broker-config
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
    persistence true
    log_dest stdout
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-broker
  labels:
    app: mqtt-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mqtt-broker
  template:
    metadata:
      labels:
        app: mqtt-broker
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.1-alpine
          ports:
            - containerPort: 1883
          volumeMounts:
            - mountPath: /mosquitto/config/mosquitto.conf
              name: config
              subPath: mosquitto.conf
            - mountPath: /mosquitto/data
              name: data
      volumes:
        - name: config
          configMap:
            name: mqtt-broker-config
        - name: data
          persistentVolumeClaim:
            claimName: mqtt-broker-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mqtt-broker-data
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: mqtt-broker
  labels:
    app: mqtt-broker
spec:
  type: ClusterIP
  ports:
    - port: 1883
      targetPort: 1883
  selector:
    app: mqtt-broker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mqtt-broker
