{{ define "inventoryStockProduct" }}
<div class="product-stock">
  <span class="stock-badge stock-badge--{{ .Severity }}">
    <span class="stock-badge__dot"></span>
    {{ if eq .Severity "empty" }}Out of Stock{{ end }}
    {{ if eq .Severity "critical" }}Only {{ .Stock }} left{{ end }}
    {{ if eq .Severity "low" }}Still {{ .Stock }} left{{ end }}
    {{ if eq .Severity "available" }}{{ .Stock }} available{{ end }}
  </span>
</div>
{{ end }}
